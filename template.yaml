AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serviço ReportGenerator - gera relatórios de feedbacks

Globals:
  Function:
    Timeout: 60
    Runtime: java17
    MemorySize: 1024

Resources:

  ## =========================
  ## Lambda - ReportGenerator
  ## =========================
  ReportGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: java17
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler
      CodeUri: target/function.zip

      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: reportGeneratorWorker
          FEEDBACK_TABLE: !ImportValue FeedbackTableName
          REPORT_BUCKET: !ImportValue ReportBucketName
          REPORT_TOPIC_ARN: !ImportValue ReportTopicArn
      Policies:
        - DynamoDBReadPolicy:
            TableName: !ImportValue FeedbackTableName
        - S3WritePolicy:
            BucketName: !ImportValue ReportBucketName
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !ImportValue ReportTopicArn
      Events:
        DemoSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)
            Input: |
              {
                "reportType": "relatorio-demo"
              }



Outputs:
  ReportGeneratorFunctionArn:
    Description: ARN da função ReportGenerator
    Value: !GetAtt ReportGeneratorFunction.Arn
    Export:
      Name: ReportGeneratorFunctionArn